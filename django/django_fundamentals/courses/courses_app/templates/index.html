<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>courses</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div class="flex flex-col p-12 ">
      <div class="max-w-xl">
        <form action="/courses/create" method="post" class="mb-10">
          {%csrf_token%}
          <h1 class="text-3xl mb-8">Add a new course</h1>
          <div class="flex w-full gap-4 mb-4">
            <label for="name" class="w-24 whitespace-nowrap">Name:</label>
            <input type="text" class="border border-black w-full" name="name" />
          </div>
          <div class="flex w-full gap-4 mb-4">
            <label for="description" class="w-24 whitespace-nowrap"
              >description:</label
            >
            <textarea
              class="border border-black w-full"
              name="description"
            ></textarea>
          </div>
          <div class="text-end">
            <button
              type="submit"
              class="border border-black text-white bg-green-400 shadow-[4px_4px_0px_black] px-4 py-2"
            >
              Add
            </button>
          </div>
        </form>
      </div>
      {%if messages%}
      <ul>
        {%for message in messages%}
        <li>{{message}}</li>
        {%endfor%}
      </ul>
      {%endif%}

      <div class="max-w-3xl">
        <h1 class="text-3xl mb-8">Courses</h1>
        <table class="border border-black border-collapse w-full">
          <tr class="divide-x divide-black bg-gray-300">
            <th class="border-b border-black p-2">Course Name</th>
            <th class="border-b border-black p-2">Description</th>
            <th class="border-b border-black p-2">Date Added</th>
            <th class="border-b border-black p-2">Action</th>
          </tr>
          {%for course in all_courses%}
          <tr class="divide-x divide-black">
            <td class="border-b border-black p-2">{{course.name}}</td>
            <td class="border-b border-black p-2">{{course.description}}</td>
            <td class="border-b border-black p-2">{{course.created_at}}</td>
            <td class="border-b border-black p-2">
              <a href="/courses/{{course.id}}/delete">remove</a>
            </td>
          </tr>
          {%endfor%}
        </table>
      </div>
    </div>
  </body>
</html>
