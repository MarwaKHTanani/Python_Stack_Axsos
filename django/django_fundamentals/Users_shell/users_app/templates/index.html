<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>users</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="p-10 flex flex-col gap-10 max-w-5xl mx-auto">
    <div class="flex flex-col gap-5">
      <h1 class="text-3xl text-center">All The Users</h1>
      <table class="border-2 border-black border-collapse w-full">
        <tr class="divide-x divide-black bg-gray-300">
          <th class="p-2 text-left">ID</th>
          <th class="p-2 text-left">Name</th>
          <th class="p-2 text-left">Email</th>
          <th class="p-2 text-left">Age</th>
        </tr>
        {%for user in users %}
        <tr class="divide-x divide-black">
          <td class="p-2">{{user.id}}</td>
          <td class="p-2">{{user.first_name}} {{user.last_name}}</td>
          <td class="p-2">{{user.email}}</td>
          <td class="p-2">{{user.age}}</td>
        </tr>
        {%endfor%}
      </table>
    </div>
    <hr class="border-t-2 border-black my-8" />

    <div class="flex flex-col gap-5">
      <h1 class="text-3xl text-center">Add a User</h1>
      <form
        action="/users/create"
        method="post"
        class="max-w-2xl mx-auto w-full flex flex-col gap-5"
      >
        {%csrf_token%}
        <div class="flex items-center gap-5 mb-5">
          <div class="flex items-center gap-5">
            <label for="first_name" class="w-24 whitespace-nowrap"
              >First Name:</label
            >
            <input
              type="text"
              name="first_name"
              id="first_name"
              class="border border-black w-45"
            />
          </div>
          <div class="flex items-center gap-5">
            <label for="last_name" class="w-24 whitespace-nowrap"
              >Last Name:</label
            >
            <input
              type="text"
              name="last_name"
              id="last_name"
              class="border border-black w-45"
            />
          </div>
        </div>
        <div class="flex items-center gap-5">
          <div class="flex items-center gap-5">
            <label for="email" class="w-24 whitespace-nowrap">Email:</label>
            <input
              type="email"
              name="email"
              id="email"
              class="border border-black w-45"
            />
          </div>
          <div class="flex items-center gap-5">
            <label for="age" class="w-24 whitespace-nowrap">Age:</label>
            <input
              type="number"
              name="age"
              id="age"
              class="border border-black w-45"
            />
          </div>
        </div>
        <div class="flex justify-center mt-2">
          <button
            type="submit"
            class="py-1 px-4 border-2 border-black shadow-[4px_4px_0px_black] text-center"
          >
            Add
          </button>
        </div>
      </form>
    </div>
  </body>
</html>
