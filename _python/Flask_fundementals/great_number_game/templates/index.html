<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Great Number Game</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="flex justify-center items-center h-screen">
    <div class="flex flex-col items-center gap-4">
      <h1 class="text-3xl font-bold text-center">
        Welcome to the Great Number Game!
      </h1>

      <p>I am thinking of a number between 1 and 100.</p>

      <p>Take a guess!</p>

      {% if message %}

      <div
        class="w-40 h-40 border-2 border-black flex flex-col justify-center items-center text-white {% if correct %} bg-green-500 {% else %} bg-red-500 {% endif %}"
      >
        <p class="text-center font-bold">{{ message }}</p>

        {% if correct %}

        <form action="/reset" method="post">
          <button
            type="submit"
            class="mt-4 bg-white text-black px-3 py-1 border border-black"
          >
            Play Again
          </button>
        </form>

        {% endif %}
      </div>

      {% endif %} {% if not correct %}

      <form
        action="/guess"
        method="post"
        class="flex flex-col items-center gap-4"
      >
        <input
          type="text"
          name="guess"
          class="border-2 border-black p-2 w-40"
        />

        <button
          type="submit"
          class="bg-blue-500 text-white px-4 py-2 border-2 border-black shadow-[4px_4px_0px_black]"
        >
          Submit
        </button>
      </form>

      {% endif %}
    </div>
  </body>
</html>
