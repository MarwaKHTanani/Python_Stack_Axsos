<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dojo Survey</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="flex justify-center items-center h-screen">
    <form
      action="/result"
      method="post"
      class="border-2 border-black p-6 w-96 min-h-[400px]"
    >
      <div class="flex items-center mb-3">
        <label for="name" class="w-40">Your Name:</label>
        <input
          type="text"
          id="name"
          name="name"
          class="border-2 border-black w-40"
        />
      </div>
      <div class="flex items-center mb-3">
        <label for="location" class="w-40">Dojo Location:</label>
        <select
          id="location"
          name="location"
          class="border-2 border-black w-40"
        >
          <option value="san jose">san jose</option>
          <option value="Seattle">Seattle</option>
          <option value="Chicago">Chicago</option>
        </select>
      </div>
      <div class="flex items-center mb-3">
        <label for="favorite_language" class="w-40">Favorite Language:</label>
        <select
          id="favorite_language"
          name="favorite_language"
          class="border-2 border-black w-40"
        >
          <option value="python">Python</option>
          <option value="javascript">JavaScript</option>
          <option value="java">Java</option>
        </select>
      </div>
      <div class="flex items-center mb-3">
        <label for="gender" class="w-40">Gender:</label>
        <input type="radio" id="male" name="gender" value="male" />
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female" />
        <label for="female">Female</label>
      </div>
      <label for="comment" class="w-40">Comment (optional):</label>
      <br />
      <textarea
        id="comment"
        name="comment"
        class="border-2 border-black w-full p-2"
      ></textarea>
      <div class="flex justify-end mt-3">
        <button
          type="submit"
          class="bg-blue-400 text-white py-2 px-4 border-2 border-black shadow-[4px_4px_0px_black] hover:bg-blue-500"
        >
          Submit
        </button>
      </div>
    </form>
  </body>
</html>
